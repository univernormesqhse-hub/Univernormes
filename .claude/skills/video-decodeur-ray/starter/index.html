<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/Inter-800.woff2') format('woff2'); font-weight: 800; }
      @font-face { font-family: 'Inter'; src: url('assets/Inter-700.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Inter'; src: url('assets/Inter-400.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Archivo Black'; src: url('assets/ArchivoBlack.woff2') format('woff2'); }
      @font-face { font-family: 'Space Mono'; src: url('assets/SpaceMono.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Space Mono'; src: url('assets/SpaceMono-Bold.woff2') format('woff2'); font-weight: 700; }
      :root { --paper: #EFECE6; --grid: #D8D1C9; --ink: #0E090A; --wine: #690F1D; --ghost: #D4BFC0; --mute: #8A8480; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--ink); }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      /* papier millimétré : grille fine + vignette chaude */
      .paper { position: absolute; inset: 0; background-color: var(--paper);
        background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
        background-size: 68px 68px; background-position: -10px -10px; }
      .vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.35) 0%, rgba(0,0,0,0) 55%, rgba(80,60,40,0.12) 100%); }
      /* en-tête de série */
      .series { position: absolute; left: 0; width: 1080px; top: 205px; text-align: center; font-size: 30px; letter-spacing: 6px; }
      .series b { font-family: 'Inter'; font-weight: 800; letter-spacing: 2px; }
      .series i { font-style: normal; color: var(--wine); font-weight: 800; margin: 0 8px; }
      .series span { font-family: 'Space Mono'; color: var(--mute); }
      /* titre karaoké : mots à venir pâles, mot dit en noir, mot-clé en bordeaux */
      .kt { position: absolute; left: 60px; width: 960px; top: 285px; text-align: center; font-weight: 800; font-size: 76px; line-height: 1.1; letter-spacing: -1px; }
      .kt .w { color: var(--ghost); }
      /* carte « néo-brutaliste » : contour noir épais + ombre décalée dure */
      .card { position: absolute; background: #fff; border: 6px solid var(--ink); border-radius: 20px; box-shadow: 14px 14px 0 var(--ink); }
      .card.wine { box-shadow: 14px 14px 0 var(--wine); }
      .mono { font-family: 'Space Mono', monospace; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }
      .lab { position: absolute; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: 3px; color: #6B6460; text-transform: uppercase; }
      .pill { position: absolute; background: var(--ink); color: #fff; font-family: 'Space Mono'; font-weight: 700; font-size: 30px; letter-spacing: 4px; padding: 8px 24px; border-radius: 6px; text-transform: uppercase; white-space: nowrap; }
      .big { font-family: 'Archivo Black'; font-size: 66px; letter-spacing: 1px; text-transform: uppercase; }
      .plus { position: absolute; font-family: 'Inter'; font-weight: 400; font-size: 60px; color: var(--wine); }
      .btn { position: absolute; padding: 26px 60px; border-radius: 80px; background: var(--wine); color: #fff; font-family: 'Archivo Black'; font-size: 60px; letter-spacing: 2px; border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); white-space: nowrap; }
      .mascot { position: absolute; width: 420px; height: 420px; }
      .mascot img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 26px 18px rgba(60,40,30,0.25)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div class="paper"></div>
      <div class="vignette"></div>
      <div class="series"><b>UNIVERSNORMES</b><i>//</i><span>QHSE DÉCODÉE</span></div>

      <!-- Beat 1 : accroche + compteur (chiffres = EXEMPLE) -->
      <div class="scene clip" id="b1" data-start="0" data-duration="3.6" data-track-index="1">
        <div class="kt" id="t1"><span class="w" data-t="0.1">Ton</span> <span class="w" data-t="0.35">casque</span> <span class="w" data-t="0.7" data-k="1">expire</span> <span class="w" data-t="1.1">aussi.</span></div>
        <div class="card" id="b1c" style="left: 300px; top: 600px; width: 480px; height: 640px; border-radius: 60px;">
          <div class="lab" style="left: 0; right: 0; top: 70px; text-align: center;">Âge du casque</div>
          <div id="cnt" style="position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-family: 'Archivo Black'; font-size: 150px;">0</div>
          <div class="lab" style="left: 0; right: 0; top: 420px; text-align: center; color: var(--wine);">mois · exemple</div>
        </div>
        <div class="plus" style="left: 90px; top: 560px;">+</div><div class="plus" style="left: 930px; top: 1300px;">+</div>
      </div>

      <!-- Beat 2 : la mascotte se présente + bouton s'abonner -->
      <div class="scene clip" id="b2" data-start="3.6" data-duration="4.4" data-track-index="1">
        <div class="kt" id="t2"><span class="w" data-t="3.7">Moi</span> <span class="w" data-t="3.95">c'est</span> <span class="w" data-t="4.2" data-k="1">Kofi,</span></div>
        <div class="mascot" id="m2" style="left: 330px; top: 860px;"><img src="assets/ouvrier-dark.png" /></div>
        <div class="card wine mono" id="tag2" style="left: 640px; top: 760px; padding: 14px 26px; font-size: 40px;">KOFI <span style="color: var(--wine);">//</span></div>
        <div class="btn" id="sub" style="left: 260px; top: 560px;">S'ABONNER</div>
        <svg id="cur" style="position: absolute; left: 700px; top: 760px;" width="90" height="120" viewBox="0 0 90 120"><path d="M 6 4 L 6 92 L 30 70 L 46 108 L 62 100 L 46 64 L 80 62 Z" fill="#fff" stroke="#0E090A" stroke-width="6" stroke-linejoin="round" /></svg>
      </div>

      <!-- Beat 3 : diagramme qui se dessine + annotation -->
      <div class="scene clip" id="b3" data-start="8.0" data-duration="4.4" data-track-index="1">
        <div class="kt" id="t3"><span class="w" data-t="8.1">Le</span> <span class="w" data-t="8.3">risque</span> <span class="w" data-t="8.6" data-k="1">grimpe.</span></div>
        <div class="card" id="b3c" style="left: 110px; top: 640px; width: 860px; height: 560px;">
          <div class="lab" style="left: 36px; top: 30px;">Usure · exemple</div>
          <div class="lab" style="right: 36px; bottom: 26px;">Temps →</div>
          <svg style="position: absolute; left: 30px; top: 90px;" width="790" height="400" viewBox="0 0 790 400"><path id="curve" d="M 10 340 C 160 330, 260 320, 360 280 S 560 160, 640 90 L 770 30" fill="none" stroke="#0E090A" stroke-width="10" stroke-linecap="round" /></svg>
        </div>
        <div class="lab" id="ann" style="left: 610px; top: 520px; color: var(--wine); font-size: 34px;">UN SEUIL</div>
        <svg id="annl" style="position: absolute; left: 640px; top: 560px;" width="120" height="180" viewBox="0 0 120 180"><path d="M 20 6 L 96 160 M 70 140 L 98 168 L 104 128" fill="none" stroke="#690F1D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <div class="pill" id="p3" style="left: 300px; top: 1250px;">À remplacer à temps</div>
      </div>

      <!-- Beat 4 : idée reçue barrée, puis la correction -->
      <div class="scene clip" id="b4" data-start="12.4" data-duration="3.6" data-track-index="1">
        <div class="kt" id="t4"><span class="w" data-t="12.5" data-k="1">Retiens</span> <span class="w" data-t="12.8">bien</span> <span class="w" data-t="13.0">ça.</span></div>
        <div class="card big" id="m1" style="left: 90px; top: 600px; width: 900px; padding: 40px 0; text-align: center; font-size: 56px;">IL N'EST PAS ÉTERNEL<div id="strike" style="position: absolute; left: 60px; right: 60px; top: 50%; height: 10px; background: var(--wine); transform-origin: 0 50%;"></div></div>
        <div class="card wine big" id="m2b" style="left: 90px; top: 800px; width: 900px; padding: 40px 0; text-align: center; font-size: 56px; color: var(--wine);">IL A UNE DATE LIMITE</div>
        <div class="mascot" id="m4" style="left: 330px; top: 1060px; width: 380px; height: 380px;"><img src="assets/ouvrier-dark.png" /></div>
      </div>

      <audio class="clip" id="s1" src="assets/sfx-pop.wav" data-start="0.5" data-duration="0.14" data-volume="0.45" data-track-index="20"></audio>
      <audio class="clip" id="s2" src="assets/sfx-tick.wav" data-start="1.2" data-duration="0.05" data-volume="0.4" data-track-index="21"></audio>
      <audio class="clip" id="s3" src="assets/sfx-pop.wav" data-start="3.8" data-duration="0.14" data-volume="0.45" data-track-index="20"></audio>
      <audio class="clip" id="s4" src="assets/sfx-click.wav" data-start="6.3" data-duration="0.12" data-volume="0.6" data-track-index="21"></audio>
      <audio class="clip" id="s5" src="assets/sfx-validation.wav" data-start="6.4" data-duration="0.12" data-volume="0.45" data-track-index="22"></audio>
      <audio class="clip" id="s6" src="assets/sfx-soft-whoosh.wav" data-start="8.6" data-duration="0.6" data-volume="0.4" data-track-index="20"></audio>
      <audio class="clip" id="s7" src="assets/sfx-pop.wav" data-start="11.0" data-duration="0.14" data-volume="0.45" data-track-index="21"></audio>
      <audio class="clip" id="s8" src="assets/sfx-deep-hit.wav" data-start="13.2" data-duration="1.4" data-volume="0.4" data-track-index="22"></audio>
      <audio class="clip" id="s9" src="assets/sfx-ding.wav" data-start="13.8" data-duration="0.7" data-volume="0.4" data-track-index="20"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const INK = '#0E090A', WINE = '#690F1D';
      // karaoké : chaque mot passe du pâle au noir (ou bordeaux si data-k) à son data-t
      document.querySelectorAll('.kt .w').forEach((w) => {
        tl.to(w, { color: w.dataset.k ? WINE : INK, duration: 0.08 }, parseFloat(w.dataset.t));
      });
      const pop = (sel, at, from) => tl.fromTo(sel, Object.assign({ opacity: 0, scale: 0.4 }, from || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.42, ease: 'back.out(2.4)' }, at);
      // B1
      pop('#b1c', 0.4);
      const c = { v: 0 }; tl.to(c, { v: 60, duration: 1.4, ease: 'power2.out', onUpdate: () => { document.getElementById('cnt').textContent = Math.round(c.v); } }, 0.8);
      tl.fromTo('#b1c', { rotation: 0 }, { rotation: -3, duration: 0.08, repeat: 5, yoyo: true }, 2.4);
      // B2 : la mascotte jaillit, le bouton apparaît, le curseur clique
      pop('#m2', 3.7, { y: 200 });
      tl.fromTo('#m2', { y: 0 }, { y: -18, duration: 0.6, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 4.2);
      pop('#tag2', 4.3);
      pop('#sub', 5.2);
      tl.fromTo('#cur', { opacity: 0, x: 220, y: 160 }, { opacity: 1, x: 0, y: -110, duration: 0.7, ease: 'power2.out' }, 5.5);
      tl.to('#sub', { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 6.3);
      tl.to('#sub', { backgroundColor: '#fff', color: INK, duration: 0.15 }, 6.4);
      tl.set('#sub', { textContent: '✓ ABONNÉ' }, 6.45);
      // B3 : la courbe se trace, l'annotation pointe
      pop('#b3c', 8.1);
      tl.fromTo('#curve', { strokeDasharray: 1100, strokeDashoffset: 1100 }, { strokeDashoffset: 0, duration: 2.2, ease: 'power1.inOut' }, 8.5);
      tl.fromTo(['#ann', '#annl'], { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3 }, 10.4);
      pop('#p3', 11.0, { y: 40 });
      // B4 : idée reçue barrée, correction, clin d'œil
      pop('#m1', 12.5);
      tl.fromTo('#strike', { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.inOut' }, 13.2);
      tl.to('#m1', { opacity: 0.45, duration: 0.2 }, 13.55);
      pop('#m2b', 13.8, { y: 60 });
      pop('#m4', 14.2, { y: 160 });
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
