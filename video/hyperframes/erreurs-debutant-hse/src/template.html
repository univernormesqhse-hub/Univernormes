<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat'; src: url('assets/Montserrat.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Patrick Hand'; src: url('assets/PatrickHand.woff2') format('woff2'); }
      @font-face { font-family: 'Archivo Black'; src: url('assets/ArchivoBlack.woff2') format('woff2'); }
      @font-face { font-family: 'Space Mono'; src: url('assets/SpaceMono-Bold.woff2') format('woff2'); font-weight: 700; }
      :root { --navy: #0E2A5C; --green: #2E9B3E; --paper: #F1EDE3; --red: #D9443A; --orange: #E8892B; --ink: #0B1A33; --pale: #B9C1CF; --hl: #BFE8C6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: 'Montserrat', sans-serif; color: var(--ink); }
      .hand { font-family: 'Patrick Hand', cursive; }
      .clip { position: absolute; }
      .scene, .bgl, .hdr, .route { left: 0; top: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; }
      .route, .hdr { overflow: visible; pointer-events: none; }
      /* ---------- fonds par partie ---------- */
      .bgl { background-color: var(--paper); }
      .bgl.paper { background-image: linear-gradient(rgba(14,42,92,0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(14,42,92,0.07) 2px, transparent 2px); background-size: 68px 68px; }
      .bgl.light { background-color: #F4F5F7; background-image: radial-gradient(rgba(14,42,92,0.12) 2.5px, transparent 2.5px); background-size: 46px 46px; }
      .bgl.warm { background: #FBFAF4; }
      .ring { position: absolute; border-radius: 50%; border: 90px solid var(--green); filter: blur(60px); opacity: 0; width: 900px; height: 900px; }
      .warm .ring { opacity: 0.15; } .ring.r1 { left: -300px; top: 100px; } .ring.r2 { right: -300px; bottom: -200px; border-color: #F2C230; }
      /* ---------- en-tête + route GPS ---------- */
      .hlogo { position: absolute; background: #fff; border-radius: 22px; padding: 9px 22px; box-shadow: 0 10px 28px rgba(14,42,92,0.14); }
      .hlogo img { height: 62px; display: block; }
      .P .hlogo { left: 50%; top: 56px; transform: translateX(-50%); } .L .hlogo { left: 40px; top: 30px; }
      .route { --rw: 760px; }
      .P .route .rline, .P .route .rfill, .P .stop, .P .stopl, .P .pin { --x0: 160px; --y0: 1730px; }
      .L .route .rline, .L .route .rfill, .L .stop, .L .stopl, .L .pin { --x0: 1100px; --y0: 62px; }
      .L .route { --rw: 680px; }
      .rline, .rfill { position: absolute; left: var(--x0); top: var(--y0); width: var(--rw); height: 8px; border-radius: 4px; }
      .rline { background: repeating-linear-gradient(90deg, #9DA8BA 0 18px, transparent 18px 30px); }
      .rfill { background: var(--green); transform-origin: 0 50%; }
      .stop { position: absolute; top: calc(var(--y0) - 18px); left: calc(var(--x0) + var(--k) * var(--rw) / 3 - 22px); width: 44px; height: 44px; border-radius: 22px; background: #fff; border: 6px solid #9DA8BA; }
      .stopl { position: absolute; top: calc(var(--y0) + 32px); left: calc(var(--x0) + var(--k) * var(--rw) / 3 - 100px); width: 200px; text-align: center; font-family: 'Patrick Hand'; font-size: 34px; color: #4A5568; }
      .pin { position: absolute; width: 64px; height: 80px; top: calc(var(--y0) - 84px); left: calc(var(--x0) + var(--p, 0) * var(--rw) / 3 - 32px); }
      /* ---------- sous-titres karaoké ---------- */
      .cap { display: flex; align-items: center; justify-content: center; text-align: center; z-index: 35; pointer-events: none; }
      .P .cap { left: 60px; top: 200px; width: 960px; height: 330px; }
      .L .cap { left: 160px; top: 892px; width: 1600px; height: 170px; }
      .capin { font-weight: 800; color: var(--navy); letter-spacing: -1px; line-height: 1.14; }
      .P .capin { font-size: 60px; } .L .capin { font-size: 54px; }
      .capin .w { display: inline-block; }
      .ink .w { color: var(--pale); } .grey .w { color: #C2C6CD; }
      .dk .capin { color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,0.55); } .dk.ink .w, .dk.grey .w { color: rgba(255,255,255,0.42); }
      /* ---------- scène ---------- */
      .stage { position: absolute; }
      .P .stage { left: 60px; top: 560px; width: 960px; height: 1060px; }
      .L .stage { left: 110px; top: 150px; width: 1700px; height: 720px; }
      .layer { position: absolute; inset: 0; }
      .ph { overflow: hidden; border-radius: 28px; border: 8px solid #fff; box-shadow: 0 30px 60px rgba(14,42,92,0.25); background: #ccd; }
      .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .chip { position: relative; display: inline-flex; align-items: center; gap: 14px; background: var(--navy); color: #fff; font-weight: 800; font-size: 42px; padding: 12px 28px 14px; border-radius: 18px; box-shadow: 0 16px 30px rgba(14,42,92,0.25); white-space: nowrap; }
      .chip img { width: 56px; height: 56px; }
      .chip.g { background: var(--green); } .chip.r { background: var(--red); } .chip.o { background: var(--orange); } .chip.w { background: #fff; color: var(--navy); border: 5px solid var(--navy); } .chip.n { background: var(--navy); }
      .chip.sm { font-size: 32px; padding: 8px 20px 10px; border-radius: 14px; }
      .pc { display: flex; width: 100%; height: 100%; gap: 40px; align-items: center; }
      .P .pc { flex-direction: column; } .P .pc > .ph { width: 100%; height: 54%; flex: none; }
      .L .pc > .ph { width: 54%; height: 100%; flex: none; }
      .chips { flex: 1; display: flex; flex-direction: column; gap: 24px; justify-content: center; align-items: center; }
      .L .chips { align-items: flex-start; }
      .vs { display: flex; width: 100%; height: 100%; }
      .P .vs { flex-direction: column; }
      .side { flex: 1; position: relative; display: flex; background: #fff; border: 6px solid var(--navy); border-radius: 26px; overflow: hidden; min-height: 0; min-width: 0; }
      .side.r { box-shadow: 14px 14px 0 var(--red); } .side.g { box-shadow: 14px 14px 0 var(--green); }
      .L .side { flex-direction: column; }
      .side > .ph { border: none; border-radius: 0; box-shadow: none; flex: none; }
      .P .side > .ph { width: 40%; height: 100%; } .L .side > .ph { width: 100%; height: 46%; }
      .body { flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
      .sdt { font-family: 'Archivo Black'; font-size: 44px; line-height: 1.05; color: var(--navy); }
      .side.r .sdt { color: var(--red); } .side.g .sdt { color: var(--green); }
      .items { display: flex; flex-wrap: wrap; gap: 12px; }
      .vsb { flex: none; align-self: center; width: 116px; height: 116px; border-radius: 58px; background: var(--navy); color: #fff; font-family: 'Archivo Black'; font-size: 46px; display: flex; align-items: center; justify-content: center; z-index: 3; border: 8px solid #fff; box-shadow: 0 12px 30px rgba(14,42,92,0.3); }
      .P .vsb { margin: -40px 0; } .L .vsb { margin: 0 -40px; }
      .stamp { position: relative; align-self: flex-start; border: 10px solid var(--red); color: var(--red); border-radius: 18px; padding: 6px 26px; font-family: 'Archivo Black'; font-size: 46px; background: #fff; transform: rotate(-4deg); white-space: nowrap; }
      .stamp.g { border-color: var(--green); color: var(--green); }
      .stk { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 30px; }
      .shead { font-family: 'Archivo Black'; font-size: 64px; color: var(--navy); text-align: center; text-transform: uppercase; }
      .steps { flex: 1; display: grid; gap: 26px; min-height: 0; }
      .P .steps { grid-template-columns: 1fr; }
      .L .steps.n3 { grid-template-columns: repeat(3, 1fr); } .L .steps.n4 { grid-template-columns: repeat(4, 1fr); }
      .step { position: relative; background: #fff; border: 6px solid var(--navy); border-radius: 24px; box-shadow: 12px 12px 0 var(--navy); display: flex; align-items: center; gap: 26px; padding: 18px 30px; min-height: 0; }
      .step.g { box-shadow: 12px 12px 0 var(--green); } .step.o { box-shadow: 12px 12px 0 var(--orange); } .step.r { box-shadow: 12px 12px 0 var(--red); }
      .L .step { flex-direction: column; justify-content: center; text-align: center; padding: 30px 22px; }
      .snum { font-family: 'Archivo Black'; font-size: 96px; line-height: 1; color: var(--navy); }
      .snum.g { color: var(--green); } .snum.o { color: var(--orange); } .snum.r { color: var(--red); }
      .sic { width: 110px; height: 110px; flex: none; }
      .slb { font-family: 'Archivo Black'; font-size: 42px; line-height: 1.05; color: var(--navy); }
      .ssb { font-size: 36px; color: #4A5568; margin-top: 4px; }
      .eq { flex: 1; display: flex; align-items: center; justify-content: center; gap: 22px; }
      .P .eq { flex-direction: column; }
      .term { background: #fff; border: 6px solid var(--navy); border-radius: 26px; padding: 22px 36px; text-align: center; font-family: 'Archivo Black'; font-size: 46px; box-shadow: 12px 12px 0 var(--navy); display: flex; align-items: center; gap: 18px; }
      .L .term { flex-direction: column; }
      .term img { width: 96px; height: 96px; }
      .term.g { box-shadow: 12px 12px 0 var(--green); color: var(--green); } .term.o { box-shadow: 12px 12px 0 var(--orange); color: var(--orange); } .term.n { background: var(--navy); color: #fff; }
      .op { font-family: 'Archivo Black'; font-size: 90px; color: var(--green); line-height: 1; }
      .mythbox { display: flex; flex-direction: column; gap: 34px; align-items: center; justify-content: center; width: 100%; height: 100%; }
      .chips .mythbox { height: auto; }
      .myth { position: relative; background: #fff; border: 6px solid var(--navy); border-radius: 22px; box-shadow: 14px 14px 0 var(--red); padding: 26px 40px; font-family: 'Archivo Black'; font-size: 46px; text-transform: uppercase; text-align: center; color: var(--navy); max-width: 100%; }
      .myth.ok { background: var(--green); color: #fff; box-shadow: 14px 14px 0 var(--navy); }
      .strike { position: absolute; left: 30px; right: 30px; top: 50%; height: 14px; margin-top: -7px; background: var(--red); transform-origin: 0 50%; }
      .qt { display: flex; align-items: center; justify-content: center; gap: 46px; width: 100%; height: 100%; }
      .P .qt { flex-direction: column; }
      .qph { flex: none; border-radius: 50%; overflow: hidden; border: 14px solid var(--green); box-shadow: 0 30px 60px rgba(14,42,92,0.25); }
      .P .qph { width: 440px; height: 440px; } .L .qph { width: 520px; height: 520px; }
      .qph img { width: 100%; height: 100%; object-fit: cover; }
      .qcard { position: relative; background: #fff; border-radius: 32px; padding: 50px 50px 36px; box-shadow: 0 30px 60px rgba(14,42,92,0.18); max-width: 1000px; }
      .qm { position: absolute; left: 24px; top: -40px; font-family: 'Archivo Black'; font-size: 160px; color: var(--green); line-height: 1; }
      .qtx { font-weight: 800; font-size: 56px; line-height: 1.18; color: var(--navy); }
      .qwho { font-size: 40px; color: #4A5568; margin-top: 16px; }
      .hl, .hlk { position: relative; display: inline-block; z-index: 0; }
      .hl::before, .hlk::before { content: ''; position: absolute; left: -6px; right: -6px; bottom: 4px; height: 44%; background: var(--hl); z-index: -1; transform: scaleX(var(--hl-x, 0)); transform-origin: 0 50%; }
      .hlk::before { transform: none; background: #FFE08A; }
      .qbig { font-family: 'Archivo Black'; font-size: 56px; line-height: 1.12; color: var(--navy); text-align: center; background: #fff; border: 6px solid var(--navy); border-radius: 24px; padding: 24px 30px; box-shadow: 12px 12px 0 var(--green); }
      .clash { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; height: 100%; position: relative; }
      .P .clash { flex-direction: column; }
      .clw { display: flex; align-items: center; gap: 20px; font-family: 'Archivo Black'; font-size: 96px; color: #fff; padding: 26px 40px; border-radius: 26px; white-space: nowrap; }
      .clw img { width: 110px; } .clw.a { background: var(--navy); } .clw.b { background: var(--green); }
      .clz { font-size: 160px; line-height: 1; }
      .clsub { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 64px; color: var(--red); }
      .big2 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; width: 100%; height: 100%; }
      .b2k { font-size: 56px; color: #4A5568; }
      .b2w { font-family: 'Archivo Black'; font-size: 150px; color: var(--navy); line-height: 1; }
      .P .b2w { font-size: 118px; } .b2w.g { color: var(--green); }
      .b2arrow { font-family: 'Patrick Hand'; font-size: 70px; color: var(--red); border-bottom: 8px solid var(--red); padding: 0 40px; }
      .bubble { position: relative; background: var(--navy); color: #fff; font-family: 'Patrick Hand'; font-size: 60px; padding: 18px 36px; border-radius: 40px; white-space: nowrap; }
      .wallbox { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 24px; }
      .wallbox svg { flex: 1; min-height: 0; }
      .wallchips { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
      .fx { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; gap: 30px; }
      .fxk { font-size: 60px; color: #4A5568; }
      .fxrow { font-family: 'Archivo Black'; color: var(--navy); text-align: center; line-height: 1.1; }
      .P .fxrow { font-size: 84px; } .L .fxrow { font-size: 104px; }
      .P .fxa, .P .fxb { display: block; } .fxa, .fxb { display: inline-block; }
      .fxrow em { font-style: normal; color: var(--green); }
      .svgst { width: 100%; height: 100%; display: block; overflow: visible; }
      .svh { font-family: 'Archivo Black'; font-size: 54px; fill: var(--navy); } .svh.g { fill: var(--green); }
      .svw { font-family: 'Archivo Black'; font-size: 38px; fill: #fff; }
      .svs { font-family: 'Patrick Hand'; font-size: 36px; fill: #fff; } .svs.n { fill: var(--navy); }
      .svc { font-family: 'Montserrat'; font-weight: 800; font-size: 28px; fill: var(--navy); } .svc.r { fill: var(--red); } .svc.w { fill: #fff; }
      .svgt { font-family: 'Archivo Black'; font-size: 110px; fill: var(--green); }
      .svbig { font-family: 'Archivo Black'; font-size: 170px; fill: #fff; }
      .svx { font-family: 'Montserrat'; font-weight: 600; font-size: 24px; fill: var(--navy); }
      /* ---------- couverture ---------- */
      .cover { background: var(--navy); }
      .cvph { position: absolute; overflow: hidden; } .cvph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
      .P .cvph { left: 0; top: 0; width: 1080px; height: 1160px; } .L .cvph { right: 0; top: 0; width: 1100px; height: 1080px; }
      .cvgrad { position: absolute; inset: 0; }
      .P .cvgrad { background: linear-gradient(180deg, rgba(14,42,92,0.7) 0%, rgba(14,42,92,0.05) 18%, rgba(14,42,92,0.15) 40%, var(--navy) 60%); }
      .L .cvgrad { background: linear-gradient(90deg, var(--navy) 0%, var(--navy) 42%, rgba(14,42,92,0.25) 62%, rgba(14,42,92,0.05) 100%); }
      .cvlogo { position: absolute; background: #fff; border-radius: 24px; padding: 10px 26px; } .cvlogo img { height: 72px; display: block; }
      .P .cvlogo { left: 50%; top: 60px; transform: translateX(-50%); } .L .cvlogo { left: 80px; top: 60px; }
      .cvtxt { position: absolute; color: #fff; }
      .P .cvtxt { left: 40px; width: 1000px; top: 900px; text-align: center; } .L .cvtxt { left: 80px; width: 940px; top: 250px; }
      .kick { display: inline-block; padding: 10px 26px; border-radius: 40px; background: var(--green); font-weight: 900; font-size: 30px; letter-spacing: 4px; }
      .cvt1 { font-family: 'Archivo Black'; font-size: 116px; line-height: 1; margin-top: 30px; }
      .cvnum { display: inline-block; background: var(--red); border-radius: 18px; padding: 0 22px; }
      .cvt2 { font-family: 'Archivo Black'; font-size: 84px; line-height: 1.05; margin-top: 10px; }
      .cvsub { font-size: 66px; color: #8FD99A; margin-top: 16px; }
      .cvchips { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 34px; }
      .P .cvchips { justify-content: center; }
      .cvchips .chip { font-size: 36px; }
      /* ---------- titres de partie ---------- */
      .chap { background: var(--navy); }
      .chph { position: absolute; inset: 0; } .chph img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45) saturate(0.9); }
      .chveil { position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(14,42,92,0.35), rgba(14,42,92,0.92)); }
      .chnum { position: absolute; font-family: 'Archivo Black'; color: #fff; line-height: 1; -webkit-text-stroke: 0; text-shadow: 0 30px 60px rgba(0,0,0,0.4); }
      .P .chnum { left: 0; width: 1080px; top: 560px; text-align: center; font-size: 440px; } .L .chnum { left: 110px; top: 210px; font-size: 600px; }
      .chcard { position: absolute; background: #fff; border-radius: 60px; padding: 40px 56px; box-shadow: 0 30px 60px rgba(0,0,0,0.35); border-left: 18px solid var(--green); }
      .P .chcard { left: 80px; width: 920px; top: 1110px; } .L .chcard { left: 640px; width: 1150px; top: 360px; }
      .chk { font-family: 'Space Mono'; font-weight: 700; font-size: 30px; letter-spacing: 4px; color: var(--green); }
      .cht { font-family: 'Archivo Black'; font-size: 76px; line-height: 1.02; color: var(--navy); margin-top: 8px; }
      .chs { font-size: 56px; color: #4A5568; margin-top: 8px; }
      .wipe { position: absolute; left: -30%; top: -30%; width: 160%; height: 160%; transform: rotate(-12deg); }
      .wipe.w1 { background: var(--green); } .wipe.w2 { background: var(--navy); }
      /* ---------- fin ---------- */
      .endc { background: linear-gradient(180deg, #FBFAF6, #EEF3EE); }
      .endlogo { position: absolute; width: 640px; left: 50%; margin-left: -320px; }
      .P .endlogo { top: 700px; } .L .endlogo { top: 300px; }
      .endtag { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 46px; color: var(--navy); }
      .P .endtag { top: 1080px; } .L .endtag { top: 690px; }
      .endtag span { color: var(--green); }
    </style>
  </head>
  <body>
    <div id="root" class="{{FMT}}" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
{{BODY}}
      <audio class="clip" id="voice" src="assets/voix-origine.m4a" data-start="0" data-duration="{{DUR}}" data-volume="1" data-track-index="10"></audio>
{{AUDIO}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at, from) => tl.fromTo(sel, Object.assign({ opacity: 0, scale: 0.55 }, from || {}), { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.42, ease: 'back.out(2.2)' }, at);
      const slam = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.28, ease: 'power4.in' }, at);
      const blurIn = (sel, at) => tl.fromTo(sel, { filter: 'blur(24px)', opacity: 0, scale: 0.97 }, { filter: 'blur(0px)', opacity: 1, scale: 1, duration: 0.35, ease: 'power2.out' }, at);
      const blurOut = (sel, at) => tl.to(sel, { filter: 'blur(24px)', opacity: 0, scale: 1.03, duration: 0.3, ease: 'power2.in' }, at);
      // karaoké : 4 grammaires selon la partie (rise = William, ink = Ray, grey = ambassa, blur = Amadou)
      document.querySelectorAll('.cap').forEach((c) => {
        const mode = c.classList[2]; const dk = c.classList.contains('dk');
        c.querySelectorAll('.w').forEach((w) => {
          const t = parseFloat(w.dataset.t);
          const col = w.classList.contains('g') ? (dk ? '#8FD99A' : '#2E9B3E') : w.classList.contains('r') ? (dk ? '#FF9A90' : '#D9443A') : (dk ? '#FFFFFF' : '#0E2A5C'); const base = dk ? '#FFFFFF' : '#0E2A5C';
          if (mode === 'ink' || mode === 'grey') tl.to(w, { color: col, duration: 0.08 }, t);
          else if (mode === 'blur') { tl.fromTo(w, { opacity: 0, filter: 'blur(12px)', color: col }, { opacity: 1, filter: 'blur(0px)', duration: 0.24, ease: 'power2.out' }, t); }
          else { tl.fromTo(w, { opacity: 0, y: 30, color: col }, { opacity: 1, y: 0, duration: 0.26, ease: 'back.out(2)' }, t); }
        });
      });
/*JS*/
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
